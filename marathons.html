<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Киномарафоны</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <h1>🍿 Апупенные смотрелки</h1>
      <nav>
        <a href="index.html">Главная</a>
        <a href="music.html">Плейлист</a>
        <a href="wheel.html">Колесо</a>
        <a href="marathons.html" class="active">Марафоны</a>
        <span id="user-email" style="color: white; margin-right: 10px"></span>
        <button id="auth-button" class="filter-btn">Войти</button>
      </nav>
    </header>

    <main>
      <div
        class="marathons-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          max-width: 1200px;
          margin: 30px auto 20px;
          padding: 0 20px;
        "
      >
        <h2>Все киномарафоны</h2>
        <button id="create-marathon-btn" class="filter-btn">
          <i class="fas fa-plus"></i> Создать марафон
        </button>
      </div>

      <div
        id="marathons-list"
        class="films-grid"
        style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr))"
      >
        <!-- Список марафонов будет здесь -->
      </div>

      <!-- Модальное окно для создания марафона -->
      <div
        id="create-modal"
        class="modal"
        style="
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
          z-index: 1000;
          align-items: center;
          justify-content: center;
        "
      >
        <div
          style="
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
          "
        >
          <h3>Создать киномарафон</h3>
          <input
            type="text"
            id="marathon-name"
            placeholder="Название"
            style="
              width: 100%;
              padding: 10px;
              margin: 10px 0;
              border: 2px solid #3498db;
              border-radius: 30px;
              box-sizing: border-box;
            "
          />
          <textarea
            id="marathon-desc"
            placeholder="Описание (необязательно)"
            style="
              width: 100%;
              padding: 10px;
              border: 2px solid #3498db;
              border-radius: 16px;
              resize: vertical;
              min-height: 80px;
              box-sizing: border-box;
            "
          ></textarea>
          <div style="margin: 10px 0">
            <label
              ><input type="checkbox" id="editable-all" checked /> Разрешить
              другим добавлять/удалять фильмы</label
            >
          </div>
          <div style="margin: 10px 0">
            <label
              ><input type="checkbox" id="mark-all" checked /> Разрешить другим
              отмечать просмотры</label
            >
          </div>
          <div
            style="
              display: flex;
              gap: 10px;
              justify-content: flex-end;
              margin-top: 20px;
            "
          >
            <button
              class="filter-btn"
              id="modal-cancel"
              style="background: #94a3b8"
            >
              Отмена
            </button>
            <button
              class="filter-btn"
              id="modal-submit"
              style="background: #22c55e"
            >
              Создать
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Сделано с ❤️ для друзей</p>
    </footer>
